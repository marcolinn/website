<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-label="明代晚期辽泽与辽西走廊示意图">
  <defs>
    <pattern id="h" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8d8375" stroke-width="1" opacity=".45"/>
    </pattern>
    <pattern id="marsh" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0,8 q4,-5 8,0 q4,5 8,0" fill="none" stroke="#8fa2a8" stroke-width="1.2" opacity=".75"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c3a2b"/>
    </marker>
    <style>
      .lbl{font-family:KaiTi,"Kaiti SC",STKaiti,SimSun,serif;fill:#241f1a;paint-order:stroke;stroke:#faf7f0;stroke-width:3.4;stroke-linejoin:round}
      .sans{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6b6358;letter-spacing:.06em;paint-order:stroke;stroke:#faf7f0;stroke-width:3}
      .city{fill:#241f1a}
      .river{fill:none;stroke:#6f8494;stroke-width:3;stroke-linecap:round}
      .sea{fill:#eaf0f2}
      .route{fill:none;stroke:#9c3a2b;stroke-width:2.6;stroke-dasharray:9 6;marker-end:url(#ar)}
      .frame{fill:none;stroke:#c9bfae;stroke-width:1.2}
    </style>
  </defs>

  <rect width="880" height="620" fill="#faf7f0"/>
  <rect x="36" y="36" width="808" height="548" fill="#f7f3e8"/>

  <!-- 渤海 / 辽东湾 -->
  <path d="M36,470 C120,500 200,506 280,512 C360,518 440,520 520,506 C580,496 640,486 700,494 C760,502 812,520 844,548 L844,584 L36,584 Z"
        class="sea"/>
  <text class="lbl" x="240" y="556" font-size="17" fill="#5b7784">渤 海</text>
  <text class="lbl" x="586" y="556" font-size="13" fill="#5b7784">辽东湾</text>

  <!-- 辽河 -->
  <path class="river" d="M470,60 C466,140 476,220 492,300 C504,364 514,430 520,486"/>
  <text class="sans" x="500" y="150" font-size="11">辽 河</text>
  <path class="river" d="M286,268 C322,300 352,332 374,364" stroke-width="2.4"/>
  <text class="sans" x="262" y="262" font-size="10.5">大凌河</text>

  <!-- 辽泽 -->
  <path d="M432,238 C500,224 556,240 570,286 C584,332 574,386 556,426 C538,464 500,478 468,462
           C436,446 424,404 424,362 C424,320 414,258 432,238 Z"
        fill="url(#marsh)" stroke="#7f959c" stroke-width="1.3"/>
  <text class="lbl" x="500" y="356" font-size="18" fill="#42606b">辽 泽</text>
  <text class="sans" x="500" y="376" font-size="10" fill="#42606b">泥淖沮洳</text>

  <!-- 医巫闾山 -->
  <path d="M226,318 L306,272 L400,296 L396,326 L306,314 L242,342 Z" fill="url(#h)" stroke="#8d8375" stroke-width="1.2"/>
  <text class="lbl" x="238" y="306" font-size="13" opacity=".88">医巫闾山</text>

  <!-- 辽西走廊 -->
  <path d="M262,470 C300,436 340,398 392,362 L434,344 L446,376 C400,412 358,452 316,492 Z"
        fill="#efe3cf" stroke="#c8a97e" stroke-width="1.3"/>
  <line x1="196" y1="418" x2="286" y2="410" stroke="#c8a97e" stroke-width="1"/>
  <text class="lbl" x="190" y="422" font-size="13" fill="#8a6a45" text-anchor="end">辽西走廊</text>

  <!-- 城市 -->
  <circle class="city" cx="576" cy="196" r="5"/><text class="lbl" x="590" y="190" font-size="15">盛京</text>
  <text class="sans" x="590" y="206" font-size="9.5">沈阳</text>

  <circle class="city" cx="592" cy="322" r="5"/><text class="lbl" x="606" y="316" font-size="15">辽阳</text>
  <text class="sans" x="606" y="332" font-size="9.5">辽东</text>

  <circle class="city" cx="430" cy="342" r="5"/><text class="lbl" x="430" y="328" font-size="15" text-anchor="middle">锦州</text>
  <circle class="city" cx="338" cy="430" r="5"/><text class="lbl" x="330" y="412" font-size="15" text-anchor="end">宁远</text>
  <circle class="city" cx="262" cy="486" r="5"/><text class="lbl" x="248" y="502" font-size="15" text-anchor="end">山海关</text>
  <circle class="city" cx="300" cy="222" r="5"/><text class="lbl" x="316" y="216" font-size="15">朝阳</text>
  <text class="sans" x="316" y="230" font-size="9.5">辽西</text>

  <!-- 进军箭头 -->
  <path class="route" d="M568,208 C540,250 516,290 492,326 C470,356 452,376 438,392"/>
  <text class="sans" x="560" y="262" font-size="10.5" fill="#9c3a2b">清军穿辽泽西进</text>
  <path class="route" d="M326,432 C300,452 282,468 268,482"/>
  <text class="sans" x="196" y="480" font-size="10.5" fill="#9c3a2b">入关</text>

  <!-- 注释 -->
  <g>
    <rect x="60" y="60" width="268" height="96" fill="#faf7f0" stroke="#d8cdba"/>
    <text class="sans" x="76" y="82" font-size="10.5">辽泽横亘于辽西与辽东之间，是天然的</text>
    <text class="sans" x="76" y="100" font-size="10.5">屏障；明末辽泽渐涸，走廊与泽地之间</text>
    <text class="sans" x="76" y="118" font-size="10.5">的通道成为绕不开的战场。</text>
    <text class="sans" x="76" y="140" font-size="10.5" fill="#9c3a2b">「以辽人守辽土，以辽土养辽人」</text>
  </g>

  <rect class="frame" x="18" y="18" width="844" height="584"/>
</svg>
