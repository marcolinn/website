<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" width="820" height="720" role="img" aria-label="上党高地位置示意图">
  <defs>
    <pattern id="h" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8d8375" stroke-width="1" opacity=".48"/>
    </pattern>
    <pattern id="h2" width="9" height="9" patternTransform="rotate(-40)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#a89e8f" stroke-width=".9" opacity=".35"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c3a2b"/>
    </marker>
    <style>
      .lbl{font-family:KaiTi,"Kaiti SC",STKaiti,SimSun,serif;fill:#241f1a;paint-order:stroke;stroke:#faf7f0;stroke-width:3.4;stroke-linejoin:round}
      .sans{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#6b6358;letter-spacing:.06em;paint-order:stroke;stroke:#faf7f0;stroke-width:3}
      .city{fill:#241f1a}
      .river{fill:none;stroke:#6f8494;stroke-width:3.2;stroke-linecap:round}
      .route{fill:none;stroke:#9c3a2b;stroke-width:2.4;stroke-dasharray:9 6;marker-end:url(#ar)}
      .frame{fill:none;stroke:#c9bfae;stroke-width:1.2}
    </style>
  </defs>

  <rect width="820" height="720" fill="#faf7f0"/>

  <!-- 底：山西高原 / 华北平原 / 中原 -->
  <path d="M40,50 L470,50 L470,660 L40,660 Z" fill="#f2ece0"/>
  <path d="M470,50 L780,50 L780,660 L470,660 Z" fill="#f8f4ea"/>

  <!-- 太行山脉 -->
  <path d="M556,60 L614,60 L640,300 L656,520 L646,648 L586,648 L572,520 L556,300 Z"
        fill="url(#h)" stroke="#8d8375" stroke-width="1.4"/>
  <text class="lbl" x="628" y="318" font-size="19" fill="#4a4136" transform="rotate(90 628 318)">太行山</text>

  <!-- 太岳山 -->
  <path d="M300,196 L372,214 L392,320 L338,404 L266,386 L254,290 Z"
        fill="url(#h2)" stroke="#a89e8f" stroke-width="1.2"/>
  <text class="lbl" x="286" y="300" font-size="14" opacity=".9">太岳山</text>

  <!-- 中条山 -->
  <path d="M180,498 L292,514 L308,554 L236,592 L170,572 Z"
        fill="url(#h2)" stroke="#a89e8f" stroke-width="1.2"/>
  <text class="lbl" x="196" y="548" font-size="13" opacity=".9">中条山</text>

  <!-- 上党高地 -->
  <path d="M400,238 C452,224 500,240 512,282 C522,320 512,344 520,372 C528,404 516,428 494,442
           C468,458 436,456 414,440 C392,424 384,398 392,376 C400,354 390,336 388,314
           C386,290 380,254 400,238 Z"
        fill="#efe3cf" stroke="#b08a5e" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="lbl" x="404" y="322" font-size="20">上 党</text>
  <text class="sans" x="404" y="342" font-size="10.5">长治 · 晋城｜天下之脊</text>

  <!-- 河流 -->
  <path class="river" d="M40,600 C150,586 240,596 300,606 C380,618 470,640 540,646 C610,652 690,640 780,618"/>
  <text class="lbl" x="424" y="668" font-size="15" fill="#4d6472">黄 河</text>
  <path class="river" d="M150,120 C176,200 190,260 186,318 C182,382 190,450 210,506" stroke-width="2.6"/>
  <text class="sans" x="120" y="180" font-size="11.5">汾 水</text>

  <!-- 城市 -->
  <circle class="city" cx="212" cy="118" r="4.6"/><text class="lbl" x="226" y="124" font-size="15">太原</text>
  <circle class="city" cx="196" cy="336" r="4.6"/><text class="lbl" x="210" y="342" font-size="15">临汾</text>
  <circle class="city" cx="250" cy="452" r="4.6"/><text class="lbl" x="264" y="458" font-size="15">河东</text>
  <circle class="city" cx="452" cy="272" r="4.6"/><text class="lbl" x="466" y="278" font-size="14">长治</text>
  <circle class="city" cx="456" cy="410" r="4.6"/><text class="lbl" x="470" y="416" font-size="14">晋城</text>
  <circle class="city" cx="700" cy="212" r="4.6"/><text class="lbl" x="714" y="218" font-size="15">邯郸</text>
  <circle class="city" cx="706" cy="322" r="4.6"/><text class="lbl" x="720" y="328" font-size="15">安阳</text>
  <circle class="city" cx="560" cy="612" r="4.6"/><text class="lbl" x="574" y="618" font-size="15">洛阳</text>

  <!-- 三陉：穿过太行的三条通道 -->
  <g stroke="#b48a5f" stroke-width="2.2">
    <line x1="548" y1="252" x2="652" y2="252"/>
    <line x1="552" y1="352" x2="654" y2="352"/>
    <line x1="566" y1="432" x2="658" y2="432"/>
  </g>
  <g class="sans" font-size="10.5" fill="#8a6a45">
    <text x="578" y="245">滏口陉</text>
    <text x="582" y="345">白陉</text>
    <text x="590" y="425">太行陉</text>
  </g>

  <!-- 长平之战 -->
  <g>
    <line x1="470" y1="474" x2="486" y2="490" stroke="#9c3a2b" stroke-width="2.4"/>
    <line x1="486" y1="474" x2="470" y2="490" stroke="#9c3a2b" stroke-width="2.4"/>
    <circle cx="478" cy="482" r="13" fill="none" stroke="#9c3a2b" stroke-width="1.4" opacity=".8"/>
    <text class="lbl" x="500" y="500" font-size="14" fill="#9c3a2b">长平之战</text>
    <text class="sans" x="500" y="516" font-size="10" fill="#9c3a2b">前 262—前 260 年</text>
  </g>

  <!-- 双方进兵 -->
  <path class="route" d="M690,232 C640,300 560,380 502,462"/>
  <text class="lbl" x="654" y="284" font-size="13" fill="#9c3a2b">赵军</text>
  <path class="route" d="M276,456 C336,470 400,482 458,488"/>
  <text class="lbl" x="318" y="442" font-size="13" fill="#9c3a2b">秦军</text>

  <!-- 图注 -->
  <g>
    <rect x="46" y="640" width="300" height="54" fill="#faf7f0" stroke="#d8cdba"/>
    <path d="M62,662 C74,660 84,664 96,668" class="river"/>
    <text class="sans" x="106" y="666" font-size="10.5">河流</text>
    <path d="M162,662 L196,662" class="route" marker-end="url(#ar)" stroke-dasharray="7 5"/>
    <text class="sans" x="204" y="666" font-size="10.5">进兵方向</text>
    <circle cx="286" cy="660" r="4" class="city"/>
    <text class="sans" x="296" y="666" font-size="10.5">城市</text>
  </g>

  <rect class="frame" x="20" y="20" width="780" height="680"/>
</svg>
